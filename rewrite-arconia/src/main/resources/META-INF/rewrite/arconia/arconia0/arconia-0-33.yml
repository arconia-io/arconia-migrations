---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.framework.UpgradeArconia_0_33
displayName: Migrate to Arconia 0.33
description: Migrate a Spring Boot application to the latest Arconia 0.33.x release.
tags:
  - arconia
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - io.arconia.rewrite.framework.UpgradeArconia_0_32

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.arconia
      artifactId: "*"
      newVersion: 0.33.x

  # Docling Document Reader - Rename Types
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.ai.document.docling.DocumentMetadata
      newFullyQualifiedTypeName: io.arconia.ai.document.docling.DoclingDocumentMetadata

  # Phoenix Testcontainers - Rename Members
  - org.openrewrite.java.ReplaceConstantWithAnotherConstant:
      existingFullyQualifiedConstantName: io.arconia.testcontainers.phoenix.PhoenixContainer.GRPC_PORT
      fullyQualifiedConstantName: io.arconia.testcontainers.phoenix.PhoenixContainer.OTLP_GRPC_PORT
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.testcontainers.phoenix.PhoenixContainer getGrpcPort()
      newMethodName: getOtlpGrpcPort

  # Dev Services - The observability dev services follow the export of telemetry instead of "skip-in-tests"
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKeyIfValue:
      oldPropertyKey: arconia.dev.services.lgtm.skip-in-tests
      propertyValue: "false"
      newPropertyKey: arconia.dev.services.lgtm.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.lgtm.skip-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.logging.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.lgtm.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.metrics.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.lgtm.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.tracing.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.lgtm.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.lgtm.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKeyIfValue:
      oldPropertyKey: arconia.dev.services.otel-collector.skip-in-tests
      propertyValue: "false"
      newPropertyKey: arconia.dev.services.otel-collector.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.otel-collector.skip-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.logging.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.otel-collector.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.metrics.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.otel-collector.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.tracing.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.otel-collector.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.otel-collector.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKeyIfValue:
      oldPropertyKey: arconia.dev.services.openlit.skip-in-tests
      propertyValue: "false"
      newPropertyKey: arconia.dev.services.openlit.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.openlit.skip-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.logging.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.openlit.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.metrics.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.openlit.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.tracing.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.openlit.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.openlit.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKeyIfValue:
      oldPropertyKey: arconia.dev.services.langfuse.skip-in-tests
      propertyValue: "false"
      newPropertyKey: arconia.dev.services.langfuse.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.langfuse.skip-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.tracing.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.langfuse.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.langfuse.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKeyIfValue:
      oldPropertyKey: arconia.dev.services.phoenix.skip-in-tests
      propertyValue: "false"
      newPropertyKey: arconia.dev.services.phoenix.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.phoenix.skip-in-tests
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: spring.test.tracing.export
      propertyValue: "true"
      requiredPropertyKey: arconia.dev.services.phoenix.export-in-tests
  - io.arconia.rewrite.spring.boot.properties.DeleteSpringBootProperty:
      propertyKey: arconia.dev.services.phoenix.export-in-tests

  # OpenTelemetry - Test Starter
  - io.arconia.rewrite.framework.opentelemetry.AddArconiaOpenTelemetryTestStarter
