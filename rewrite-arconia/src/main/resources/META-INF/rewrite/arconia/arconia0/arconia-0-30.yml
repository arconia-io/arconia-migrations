---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.framework.UpgradeArconia_0_30
displayName: Migrate to Arconia 0.30
description: Migrate a Spring Boot application to the latest Arconia 0.30.x release.
tags:
  - arconia
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - io.arconia.rewrite.framework.UpgradeArconia_0_29

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.arconia
      artifactId: "*"
      newVersion: 0.30.x

  # Rename Properties
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: arconia.dev.services.pulsar.management-console-port
      newPropertyKey: arconia.dev.services.pulsar.admin-port

  # Rename Methods
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.pulsar.PulsarDevServicesProperties.getManagementConsolePort()
      newMethodName: getAdminPort
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.pulsar.PulsarDevServicesProperties.setManagementConsolePort(int)
      newMethodName: setAdminPort
