---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.framework.UpgradeArconia_0_32
displayName: Migrate to Arconia 0.32
description: Migrate a Spring Boot application to the latest Arconia 0.32.x release.
tags:
  - arconia
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - io.arconia.rewrite.framework.UpgradeArconia_0_31

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.arconia
      artifactId: "*"
      newVersion: 0.32.x

  # Rename Properties
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: arconia.dev.services.keycloak.realm.import-path
      newPropertyKey: arconia.dev.services.keycloak.realm.import-paths
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: arconia.dev.services.docling.enable-ui
      newPropertyKey: arconia.dev.services.docling.ui-enabled

  # OpenTelemetry Conventions: HTTP
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: arconia.observations.conventions.opentelemetry.http.include-url-query
      newPropertyKey: arconia.observations.conventions.opentelemetry.http.capture-url-query

  # OpenTelemetry AI Conventions: content capturing
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: arconia.observations.conventions.opentelemetry.ai.include-tool-definitions
      newPropertyKey: arconia.observations.conventions.opentelemetry.ai.capture-tool-definitions
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: arconia.observations.conventions.opentelemetry.ai.include-tool-call-content
      newPropertyKey: arconia.observations.conventions.opentelemetry.ai.capture-tool-call-content
  # 'capture-content=span-events' becomes the destination, and enables message capturing
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKeyIfValue:
      oldPropertyKey: arconia.observations.conventions.opentelemetry.ai.capture-content
      propertyValue: span-events
      newPropertyKey: arconia.observations.conventions.opentelemetry.ai.inference-content-destination
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKeyIfValue:
      oldPropertyKey: arconia.observations.conventions.opentelemetry.ai.capture-content
      propertyValue: SPAN_EVENTS
      newPropertyKey: arconia.observations.conventions.opentelemetry.ai.inference-content-destination
  - io.arconia.rewrite.spring.boot.properties.AddSpringBootProperty:
      propertyKey: arconia.observations.conventions.opentelemetry.ai.capture-message-content
      propertyValue: "true"
      requiredPropertyKey: arconia.observations.conventions.opentelemetry.ai.inference-content-destination
  # 'none' and 'span-attributes' become the message capturing switch ('span-attributes' is the default destination)
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: arconia.observations.conventions.opentelemetry.ai.capture-content
      newPropertyKey: arconia.observations.conventions.opentelemetry.ai.capture-message-content
  - io.arconia.rewrite.spring.boot.properties.ChangeSpringBootPropertyValue:
      propertyKey: arconia.observations.conventions.opentelemetry.ai.capture-message-content
      oldPropertyValue: "(?i)^none$"
      newPropertyValue: "false"
      useRegex: true
  - io.arconia.rewrite.spring.boot.properties.ChangeSpringBootPropertyValue:
      propertyKey: arconia.observations.conventions.opentelemetry.ai.capture-message-content
      oldPropertyValue: "(?i)^span[-_]attributes$"
      newPropertyValue: "true"
      useRegex: true

  # Comment Properties
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.multitenancy.resolution.fixed.enabled"
      comment: "Removed. The fixed tenant is now a resolution mode. Set 'arconia.multitenancy.resolution.http.resolution-mode' to 'fixed' for a single-tenant deployment, or list 'fixed' last, as in 'header, fixed', to use it as the default tenant."

  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "management.health.tenantdetails.enabled"
      comment: "Removed with the tenant details health indicator. The 'db' health indicator already reports whether the database holding the tenant details can be reached."

  # Rename Packages
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.arconia.multitenancy.core.context.resolvers
      newPackageName: io.arconia.multitenancy.core.resolution
      recursive: false
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.arconia.multitenancy.core.context.events
      newPackageName: io.arconia.multitenancy.core.context
      recursive: false
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.arconia.multitenancy.web.context.filters
      newPackageName: io.arconia.multitenancy.web.context
      recursive: false
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.arconia.multitenancy.web.context.annotations
      newPackageName: io.arconia.multitenancy.web.context
      recursive: false
  - org.openrewrite.java.ChangePackage:
      oldPackageName: io.arconia.multitenancy.web.context.resolvers
      newPackageName: io.arconia.multitenancy.web.resolution
      recursive: false

  # Rename Types
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.multitenancy.core.exceptions.TenantNotFoundException
      newFullyQualifiedTypeName: io.arconia.multitenancy.core.context.TenantNotFoundException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.multitenancy.core.exceptions.TenantVerificationException
      newFullyQualifiedTypeName: io.arconia.multitenancy.core.resolution.TenantVerificationException
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.multitenancy.core.tenantdetails.TenantIdentifierValidator
      newFullyQualifiedTypeName: io.arconia.multitenancy.core.resolution.TenantIdentifierValidator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.multitenancy.core.tenantdetails.DefaultTenantIdentifierValidator
      newFullyQualifiedTypeName: io.arconia.multitenancy.core.resolution.DefaultTenantIdentifierValidator
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.multitenancy.core.tenantdetails.TenantVerifier
      newFullyQualifiedTypeName: io.arconia.multitenancy.core.resolution.TenantVerifier
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.multitenancy.core.tenantdetails.DefaultTenantVerifier
      newFullyQualifiedTypeName: io.arconia.multitenancy.core.resolution.DefaultTenantVerifier
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.multitenancy.core.autoconfigure.PropertiesTenantDetailsService
      newFullyQualifiedTypeName: io.arconia.multitenancy.core.tenantdetails.InMemoryTenantDetailsService
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.dev.services.api.config.BaseDevServicesProperties
      newFullyQualifiedTypeName: io.arconia.dev.services.api.config.DevServicesProperties

  # Rename Methods
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.DevServiceRegistration name()
      newMethodName: getName
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.DevServiceRegistration description()
      newMethodName: getDescription
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.DevServiceRegistration origin()
      newMethodName: getOrigin
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.DevServiceRegistration containerInfo()
      newMethodName: getContainerInfo
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.DevServiceRegistration links()
      newMethodName: getLinks
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.DevServiceRegistration sslBundleName()
      newMethodName: getSslBundleName
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo id()
      newMethodName: getId
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo imageName()
      newMethodName: getImageName
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo names()
      newMethodName: getNames
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo ports()
      newMethodName: getPorts
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo labels()
      newMethodName: getLabels
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo state()
      newMethodName: getState
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo status()
      newMethodName: getStatus
