      comment: "Replaced by 'reuse-strategy'. Use 'reuse-strategy: none' instead of 'shared: false'. Sharing ('framework') is the default."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.dev.services.redis.reuse"
      comment: "Replaced by 'reuse-strategy'. Use 'reuse-strategy: testcontainers' instead of 'reuse: true'."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.otel.logs.logback-bridge.capture-key-value-pair-attributes"
      comment: "Replaced by the 'structured-attributes' selector, which also covers Logstash markers and structured arguments. Use 'structured-attributes.included: \"*\"' to capture all key-value pairs."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.otel.logs.logback-bridge.capture-logstash-marker-attributes"
      comment: "Replaced by the 'structured-attributes' selector, which also covers SLF4J key-value pairs and Logstash structured arguments. Use 'structured-attributes.included: \"*\"' to capture all Logstash marker attributes."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.otel.logs.logback-bridge.capture-logger-context"
      comment: "Replaced by the 'logger-context-attributes' selector. Use 'logger-context-attributes.included: \"*\"' to capture all logger context properties."

  # Rename Properties
  - io.arconia.rewrite.spring.boot.properties.RenameSpringBootPropertyKey:
      oldPropertyKey: "arconia.otel.logs.logback-bridge.capture-mdc-attributes"
      newPropertyKey: "arconia.otel.logs.logback-bridge.mdc-attributes.included"

  # Rename Types
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.dev.services.core.registration.DevServicesRegistry$ServiceSpec
      newFullyQualifiedTypeName: io.arconia.dev.services.core.registration.DevServiceSpec
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.dev.services.core.container.DevServiceLabels
      newFullyQualifiedTypeName: io.arconia.dev.services.api.registration.DevServiceLabels
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.dev.services.api.config.SharedDevServicesProperties
      newFullyQualifiedTypeName: io.arconia.dev.services.api.config.BaseDevServicesProperties
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: io.arconia.dev.services.api.provider.DevServiceCategories
      newFullyQualifiedTypeName: io.arconia.dev.services.core.registration.DevServiceCategories

  # Rename Methods
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo exposedPorts()
      newMethodName: ports
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.registration.ContainerInfo$Builder exposedPorts(java.util.List)
      newMethodName: ports
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.config.ResourceMapping getSourcePath()
      newMethodName: sourcePath
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.config.ResourceMapping getContainerPath()
      newMethodName: containerPath
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.config.VolumeMapping getHostPath()
      newMethodName: hostPath
  - org.openrewrite.java.ChangeMethodName:
      methodPattern: io.arconia.dev.services.api.config.VolumeMapping getContainerPath()
      newMethodName: containerPath

  # Remove Methods
  # The common properties are now applied by the framework when it creates the container.
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: io.arconia.dev.services.core.container.ContainerConfigurer base(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: io.arconia.dev.services.core.container.ContainerConfigurer reuse(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: io.arconia.dev.services.core.container.ContainerConfigurer resources(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: io.arconia.dev.services.core.container.ContainerConfigurer volumes(..)
  - org.openrewrite.java.RemoveMethodInvocations:
      methodPattern: io.arconia.dev.services.core.container.ContainerConfigurer jdbc(..)

  # Replace Constants
  - org.openrewrite.java.ReplaceConstant:
      owningType: io.arconia.dev.services.api.config.JdbcDevServicesProperties
      constantName: DEFAULT_USERNAME
      literalValue: '"arconia"'
  - org.openrewrite.java.ReplaceConstant:
      owningType: io.arconia.dev.services.api.config.JdbcDevServicesProperties
      constantName: DEFAULT_PASSWORD
      literalValue: '"arconia"'
  - org.openrewrite.java.ReplaceConstant:
      owningType: io.arconia.dev.services.api.config.JdbcDevServicesProperties
      constantName: DEFAULT_DB_NAME
      literalValue: '"arconia"'
