---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.framework.UpgradeArconia_0_31
displayName: Migrate to Arconia 0.31
description: Migrate a Spring Boot application to the latest Arconia 0.31.x release.
tags:
  - arconia
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - io.arconia.rewrite.framework.UpgradeArconia_0_30
  - io.arconia.rewrite.docling.UpgradeDocling_0_7

  # Remove Dependencies
  - org.openrewrite.java.dependencies.RemoveDependency:
      groupId: io.arconia
      artifactId: arconia-dev-services-tests

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: io.arconia
      artifactId: "*"
      newVersion: 0.31.x

  # Comment Properties
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.dev.services.startup.log-level"
      comment: "Removed as redundant. Testcontainers logs startup errors to the console already."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.dev.services.network.name"
      comment: "Removed. Cross-application networks are no longer managed by Arconia. To join a network you manage, define your own Network bean."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.dev.services.artemis.reuse"
      comment: "Replaced by 'reuse-strategy'. Use 'reuse-strategy: testcontainers' instead of 'reuse: true'."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.dev.services.artemis.shared"
      comment: "Replaced by 'reuse-strategy'. Use 'reuse-strategy: none' instead of 'shared: false'. Sharing ('framework') is the default."
  - io.arconia.rewrite.spring.boot.properties.CommentSpringBootProperty:
      propertyKey: "arconia.dev.services.docling.reuse"
      comment: "Replaced by 'reuse-strategy'. Use 'reuse-strategy: testcontainers' instead of 'reuse: true'."
