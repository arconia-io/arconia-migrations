# Based on https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.2-Release-Notes
---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.spring.boot4.UpgradeSpringBoot_4_2
displayName: Migrate to Spring Boot 4.2
description: Migrate a Spring Boot application to the latest Spring Boot 4.2.x release.
tags:
  - spring
  - boot
preconditions:
  - org.openrewrite.Singleton
recipeList:
  # Previous Version
  - io.arconia.rewrite.spring.boot4.UpgradeSpringBoot_4_1

  # Spring Framework
  - io.arconia.rewrite.spring.framework7.UpgradeSpringFramework_7_1

  # Configuration Properties
  - io.arconia.rewrite.spring.boot4.UpgradeSpringBootProperties_4_2

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: "*"
      newVersion: 4.2.x
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-dependencies
      newVersion: 4.2.x
      overrideManagedVersion: true
  - org.openrewrite.gradle.plugins.UpgradePluginVersion:
      pluginIdPattern: org.springframework.boot
      newVersion: 4.2.x
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-gradle-plugin
      newVersion: 4.2.x
  - org.openrewrite.maven.UpgradePluginVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-maven-plugin
      newVersion: 4.2.x
  - org.openrewrite.maven.UpgradeParentVersion:
      groupId: org.springframework.boot
      artifactId: spring-boot-starter-parent
      newVersion: 4.2.x

  # Managed Dependencies
  - io.arconia.rewrite.spring.cloud2026.UpgradeSpringCloud_2026_0
  - io.arconia.rewrite.spring.ai2.UpgradeSpringAi_2_1
  - io.arconia.rewrite.spring.modulith2.UpgradeSpringModulith_2_2
  - io.arconia.rewrite.spring.security7.UpgradeSpringSecurity_7_2
  - io.arconia.rewrite.spring.data2026.UpgradeSpringData_2026_1

  # Modules
  - io.arconia.rewrite.spring.boot4.MigrateSpringBootHttp_4_2
  - io.arconia.rewrite.spring.boot4.MigrateSpringBootRabbitMq_4_2
