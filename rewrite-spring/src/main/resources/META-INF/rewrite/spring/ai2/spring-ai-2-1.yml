---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.spring.ai2.UpgradeSpringAi_2_1
displayName: Migrate to Spring AI 2.1
description: Migrate a Spring Boot application to the latest Spring AI 2.1.x release.
tags:
  - spring
  - ai
preconditions:
  - org.openrewrite.Singleton
recipeList:

  # Configuration Properties
  - io.arconia.rewrite.spring.ai2.UpgradeSpringAiProperties_2_1

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.ai
      artifactId: "*"
      newVersion: 2.1.x
      overrideManagedVersion: true

  # Modules
  - io.arconia.rewrite.spring.ai2.MigrateSpringAiAnthropic_2_1
  - io.arconia.rewrite.spring.ai2.MigrateSpringAiDeepSeek_2_1
  - io.arconia.rewrite.spring.ai2.MigrateSpringAiMcp_2_1

---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.spring.ai2.MigrateSpringAiAnthropic_2_1
displayName: Migrate the Spring AI Anthropic module to Spring AI 2.1
description: Update usages of Spring AI Anthropic APIs that were deprecated in Spring AI 2.1. Anthropic API version `2026-10-21` rejects sampling options, so they are removed from `AnthropicChatOptions` builders.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - io.arconia.rewrite.spring.ai2.RemoveAnthropicSamplingOptions

---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.spring.ai2.MigrateSpringAiDeepSeek_2_1
displayName: Migrate the Spring AI DeepSeek module to Spring AI 2.1
description: Replace the `DeepSeekAssistantMessage.prefixAssistantMessage` factory methods, removed in Spring AI 2.1, with the equivalent `DeepSeekAssistantMessage.builder()` chain.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - io.arconia.rewrite.spring.ai2.UseDeepSeekAssistantMessageBuilder

---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.spring.ai2.MigrateSpringAiMcp_2_1
displayName: Migrate the Spring AI MCP module to Spring AI 2.1
description: Update usages of Spring AI MCP APIs that were deprecated for removal in Spring AI 2.1. The `toolCallExceptionClass` parameter of the MCP tool method callbacks is no longer used, since exception dispatch became type-based in Spring AI 2.0.1, so the constructors that accept it give way to the three-argument ones.
preconditions:
  - org.openrewrite.Singleton
recipeList:
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.springframework.ai.mcp.annotation.method.tool.SyncMcpToolMethodCallback <constructor>(org.springframework.ai.mcp.annotation.method.tool.ReturnMode, java.lang.reflect.Method, java.lang.Object, java.lang.Class)
      argumentIndex: 3
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.springframework.ai.mcp.annotation.method.tool.AsyncMcpToolMethodCallback <constructor>(org.springframework.ai.mcp.annotation.method.tool.ReturnMode, java.lang.reflect.Method, java.lang.Object, java.lang.Class)
      argumentIndex: 3
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.springframework.ai.mcp.annotation.method.tool.SyncStatelessMcpToolMethodCallback <constructor>(org.springframework.ai.mcp.annotation.method.tool.ReturnMode, java.lang.reflect.Method, java.lang.Object, java.lang.Class)
      argumentIndex: 3
  - org.openrewrite.java.DeleteMethodArgument:
      methodPattern: org.springframework.ai.mcp.annotation.method.tool.AsyncStatelessMcpToolMethodCallback <constructor>(org.springframework.ai.mcp.annotation.method.tool.ReturnMode, java.lang.reflect.Method, java.lang.Object, java.lang.Class)
      argumentIndex: 3
