# Based on https://github.com/spring-projects/spring-modulith/releases/tag/2.1.0
---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.spring.modulith2.UpgradeSpringModulith_2_1
displayName: Migrate to Spring Modulith 2.1
description: Migrate a Spring Boot application to the latest Spring Modulith 2.1.x release.
tags:
  - spring
  - modulith
preconditions:
  - org.openrewrite.Singleton
recipeList:

  # Configuration Properties
  - io.arconia.rewrite.spring.modulith2.UpgradeSpringModulithProperties_2_1

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.modulith
      artifactId: "*"
      newVersion: 2.1.x
      overrideManagedVersion: true

  # Observability
  - org.openrewrite.java.dependencies.ChangeDependency:
      oldGroupId: org.springframework.modulith
      oldArtifactId: spring-modulith-observability
      newGroupId: org.springframework.modulith
      newArtifactId: spring-modulith-observability-core
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.modulith.observability.support.ModulithContext
      newFullyQualifiedTypeName: org.springframework.modulith.observability.ModulithContext
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.modulith.observability.support.ModulithObservationConvention
      newFullyQualifiedTypeName: org.springframework.modulith.observability.ModulithObservationConvention
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.modulith.observability.support.ObservedModule
      newFullyQualifiedTypeName: org.springframework.modulith.observability.ObservedModule
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.modulith.observability.support.ObservedModuleType
      newFullyQualifiedTypeName: org.springframework.modulith.observability.ObservedModuleType

  # Testing
  - io.arconia.rewrite.spring.modulith2.UsePublishedEventAssertMatchingValue
