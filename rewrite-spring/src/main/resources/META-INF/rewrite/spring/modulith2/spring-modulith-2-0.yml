# Based on https://github.com/spring-projects/spring-modulith/releases/tag/2.0.0
---
type: specs.openrewrite.org/v1beta/recipe
name: io.arconia.rewrite.spring.modulith2.UpgradeSpringModulith_2_0
displayName: Migrate to Spring Modulith 2.0
description: Migrate a Spring Boot application to the latest Spring Modulith 2.0.x release.
tags:
  - spring
  - modulith
preconditions:
  - org.openrewrite.Singleton
recipeList:

  # Configuration Properties
  - io.arconia.rewrite.spring.modulith2.UpgradeSpringModulithProperties_2_0

  # Dependency Versions
  - org.openrewrite.java.dependencies.UpgradeDependencyVersion:
      groupId: org.springframework.modulith
      artifactId: "*"
      newVersion: 2.0.x
      overrideManagedVersion: true

  # Removed APIs
  - org.openrewrite.java.ChangeType:
      oldFullyQualifiedTypeName: org.springframework.modulith.ApplicationModuleListener
      newFullyQualifiedTypeName: org.springframework.modulith.events.ApplicationModuleListener
